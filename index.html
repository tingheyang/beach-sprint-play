function frame(now){let dt=Math.min((now-prev)/1000,.04);prev=now;update(dt);waterEffects(dt);let water=['out','turn','home'].includes(state==='pause'?prior:state);camY=water?1.15:1.68;let motion=lowMotion?.16:1;camY+=water?(Math.sin(t*1.7)*.13+Math.sin(t*2.1)*.06)*motion:Math.sin(t*9)*.035*speed;camYaw=state==='intro'?0:heading+(water&&backView?Math.PI:0);camRoll=water?Math.sin(t*1.4)*.018*motion:0;camPitch=-.23+(water?Math.sin(t*1.7)*.014*motion:0);if(water&&W>H&&H<=600&&!thirdView){camY-=.18;camPitch-=.22;}if(water){let kick=Math.max(0,1-(t-feedbackAt)/.65)*strokeQuality;camPitch-=Math.sin(Math.min(1,(t-feedbackAt)/.65)*Math.PI)*kick*.045*motion;}viewX=x;viewZ=z;if(water&&thirdView){viewX=x-Math.sin(heading)*6.5-Math.cos(heading)*4.2;viewZ=z-Math.cos(heading)*6.5+Math.sin(heading)*4.2;camY=3.7;camYaw=heading+.54;camPitch=-.5;camRoll*=.35;}if(window.presentationCamera){camY-=.15;camPitch-=.18;}if(gl){gl.uniform2f(loc.res,canvas.width,canvas.height);gl.uniform1f(loc.time,t);gl.uniform3f(loc.cam,viewX,camY,viewZ);gl.uniform1f(loc.yaw,camYaw);gl.uniform1f(loc.roll,camRoll);gl.uniform1f(loc.pitch,camPitch);gl.uniform1f(loc.velocity,speed);gl.uniform1f(loc.lens,Math.min(1.15,W/H*.85));gl.drawArrays(gl.TRIANGLES,0,6);}ctx.clearRect(0,0,W,H);land();[{z:160,n:'3'},{z:98,n:'2'},{z:48,n:'1'}].sort((a,b)=>Math.abs(b.z-z)-Math.abs(a.z-z)).forEach(a=>{buoy(0,a.z,a.n);buoy(25,a.z,a.n,'#ed7754');});gateMarker();shoreBoat();boat();drawWaterEffects();drawRush();if(window.craft3D)window.craft3D.render({W,H,x,z,camY,camYaw,camPitch,camRoll,state,prior,t,heading,strokeAnim,backView,thirdView,viewX,viewZ,speed});mini();$('clock').textContent=format(elapsed);$('speed').textContent=(speed*3.6).toFixed(1);$('strokes').textContent=strokeCount;$('energy').style.width=energy+'%';$('energy').style.background=energy<25?'#f29271':energy<50?'#edce75':'#ccf589';$('energyText').textContent=Math.round(energy)+'%';$('needle').style.left=(rhythmPhase()*100)+'%';$('toast').style.opacity=t<toastEnd&&!(cruising()&&['精准','偏早','偏晚'].includes($('toast').textContent))?1:0;$('viewBtn').textContent=thirdView?'视角：追踪全景':backView?'视角：划手背向':'视角：前向辅助';$('assistBtn').textContent='航向辅助：'+(assist?'开 · 体验':'关 · 挑战');$('motionBtn').textContent='镜头起伏：'+(lowMotion?'低':'标准');let si={run:0,out:1,turn:2,home:3,finishRun:4,finish:5}[state]??-1;[...$('steps').children].forEach((e,i)=>e.className=i===si?'active':i<si?'done':'');
$('strokePanel').style.display=water&&state!=='pause'?'block':'none';
feedbackUI();$('strokePanel').classList.toggle('cruising',cruising());$('strokePanel').style.top=water&&thirdView?'76%':'50%';
$('strokeMode').textContent=cruising()?'巡航中 · 稳定划桨，不计精准':t<rhythmStart?'回桨中 · 等待下一次入水':'短按空格 · 亮区入水｜长按 · 巡航';
if(state==='run'){$('target').textContent='W / 空格 · 奔跑';$('hint').textContent='';}else if(state==='finishRun'){$('target').textContent='W / 空格 · 冲线';$('hint').textContent='';}else if(['out','turn','home'].includes(state)){let g=path[gate],err=angle(Math.atan2(g.x-x,g.z-z)-camYaw);$('target').textContent=(Math.abs(err)>Math.PI*.65?'↓':Math.abs(err)<.15?'↑':err>0?'↱':'↰')+' '+Math.round(Math.hypot(g.x-x,g.z-z))+' m';$('hint').textContent=(thirdView?'追踪全景 · 箭头按镜头指向目标':backView?'背向观察 · 箭头按当前镜头指向目标':'前向观察 · 箭头按当前镜头指向目标')+'｜'+(assist?'辅助体验 · 自动循线，A / D 接管':'手动挑战 · A / D 转向')+' · '+g.name;}else{$('target').textContent='';$('hint').textContent='';}
if(window.demoCapture)window.demoCapture();requestAnimationFrame(frame);}
